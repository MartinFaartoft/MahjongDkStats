name: Deploy mahjong to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: MartinFaartoft/codex-actions/.github/workflows/deploy-site.yml@v1
    permissions:
      contents: read
      packages: write
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
